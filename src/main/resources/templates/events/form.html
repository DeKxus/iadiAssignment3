<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="util/head :: head"></head>
<body>

<div th:replace="util/navbar :: navbar"></div>

<div class="container mt-4">
    <h1>Event Form</h1>

    <!-- CREATE FORM -->
    <div th:if="${eventId == null}">
        <form th:action="@{/clubs/{c}/events(c=${clubId})}"
              method="post"
              th:object="${eventForm}">

            <div class="mb-3">
                <label>Name</label>
                <input type="text" th:field="*{name}" class="form-control"/>
                <div class="text-danger" th:errors="*{name}"></div>
            </div>

            <div class="mb-3">
                <label>Date</label>
                <input type="date" th:field="*{date}" class="form-control"/>
                <div class="text-danger" th:errors="*{date}"></div>
            </div>

            <div class="mb-3">
                <label>Type</label>
                <select th:field="*{type}" class="form-control">
                    <option th:each="t : ${T(pt.unl.fct.iadi.novaevents.model.EventType).values()}"
                            th:value="${t}"
                            th:text="${t}">
                    </option>
                </select>
                <div class="text-danger" th:errors="*{type}"></div>
            </div>

            <div class="mb-3">
                <label>Location</label>
                <input type="text" th:field="*{location}" class="form-control"/>
            </div>

            <div class="mb-3">
                <label>Description</label>
                <textarea th:field="*{description}" class="form-control"></textarea>
            </div>

            <button type="submit" class="btn btn-success">Create</button>
        </form>

        <div th:if="${errorMessage}" class="alert alert-danger">
            <p th:text="${errorMessage}"></p>
        </div>

    </div>

    <!-- EDIT FORM -->
    <div th:if="${eventId != null}">
        <form th:action="@{/clubs/{c}/events/{e}(c=${clubId}, e=${eventId})}"
              method="post"
              th:object="${eventForm}">

            <div class="mb-3">
                <label>Name</label>
                <input type="text" th:field="*{name}" class="form-control"/>
                <div class="text-danger" th:errors="*{name}"></div>
            </div>

            <div class="mb-3">
                <label>Date</label>
                <input type="date" th:field="*{date}" class="form-control"/>
                <div class="text-danger" th:errors="*{date}"></div>
            </div>

            <div class="mb-3">
                <label>Type</label>
                <select th:field="*{type}" class="form-control">
                    <option th:each="t : ${T(pt.unl.fct.iadi.novaevents.model.EventType).values()}"
                            th:value="${t}"
                            th:text="${t}">
                    </option>
                </select>
                <div class="text-danger" th:errors="*{type}"></div>
            </div>

            <div class="mb-3">
                <label>Location</label>
                <input type="text" th:field="*{location}" class="form-control"/>
            </div>

            <div class="mb-3">
                <label>Description</label>
                <textarea th:field="*{description}" class="form-control"></textarea>
            </div>

            <button type="submit" class="btn btn-success">Update</button>
        </form>
    </div>

</div>

</body>
</html>
