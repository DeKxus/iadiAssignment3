<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="util/head :: head"></head>
<body>

<div th:replace="util/navbar :: navbar"></div>

<div class="container mt-4">
    <h1 th:text="${club.name}"></h1>

    <p th:text="${club.description}"></p>
    <p><strong>Category:</strong> <span th:text="${club.category}"></span></p>

    <a class="btn btn-primary"
       th:href="@{/clubs/{id}/events/new(id=${club.id})}">
        Create Event
    </a>

    <h2 class="mt-4">Events</h2>

    <table class="table">
        <tbody>
        <tr th:each="event : ${events}">
            <td>
                <a th:href="@{/clubs/{clubId}/events/{eventId}(clubId=${club.id}, eventId=${event.id})}"
                   th:text="${event.name}">
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
